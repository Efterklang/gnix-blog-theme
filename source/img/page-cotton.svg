<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 棉纸（宣纸）只有云状的厚薄变化，看不到纤维。 -->
    <filter id="cotton-cloud" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.007" numOctaves="2" seed="5" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.075"/>
      </feComponentTransfer>
    </filter>
    <!-- 极浅的绒面，保留一点触感而不产生颗粒。 -->
    <filter id="cotton-nap" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.26" numOctaves="2" seed="9" stitchTiles="stitch"/>
      <feDiffuseLighting surfaceScale="0.9" diffuseConstant="0.8" lighting-color="#fff">
        <feDistantLight azimuth="225" elevation="55"/>
      </feDiffuseLighting>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" filter="url(#cotton-cloud)"/>
  <rect width="100%" height="100%" filter="url(#cotton-nap)"/>
</svg>
