<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 经线：x 向高频、y 向低频，形成细密的竖纹。 -->
    <filter id="linen-warp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.62 0.03" numOctaves="2" seed="6" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.085"/>
      </feComponentTransfer>
    </filter>
    <!-- 纬线：与经线正交，两层叠出一上一下的平纹组织。 -->
    <filter id="linen-weft" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.62" numOctaves="2" seed="14" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.085"/>
      </feComponentTransfer>
    </filter>
    <!-- 纱线本身的粗细不匀，让织物不显得机械。 -->
    <filter id="linen-slub" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" filter="url(#linen-slub)"/>
  <rect width="100%" height="100%" filter="url(#linen-warp)"/>
  <rect width="100%" height="100%" filter="url(#linen-weft)"/>
</svg>
