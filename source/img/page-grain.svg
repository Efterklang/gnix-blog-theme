<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 低频明暗变化，模拟纸浆分布。 -->
    <filter id="pulp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
    </filter>
    <!-- 横纵频率不同，形成短而不规则的纸纤维。 -->
    <filter id="fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.48" numOctaves="3" seed="21" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.065"/>
      </feComponentTransfer>
    </filter>
    <!-- 用微小高度变化生成表面凹凸的柔和光照。 -->
    <filter id="tooth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="12" stitchTiles="stitch"/>
      <feDiffuseLighting surfaceScale="1.4" diffuseConstant="0.75" lighting-color="#fff">
        <feDistantLight azimuth="225" elevation="45"/>
      </feDiffuseLighting>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.09"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" filter="url(#pulp)"/>
  <rect width="100%" height="100%" filter="url(#fibers)"/>
  <rect width="100%" height="100%" filter="url(#tooth)"/>
</svg>
